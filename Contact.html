<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Portfolio</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="STYLE.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">Mon Portfolio</a>
        </div>
    </nav>

    <!-- Section Contact -->
    <section class="contact-section py-5">
        <div class="container">
            <h2 class="text-center mb-4">Contactez-nous</h2>

            <div class="row">
                
                <!-- Formulaire -->
                <div class="col-md-6">
                    <form>
                        <div class="mb-3">
                            <label class="form-label">Nom</label>
                            <input type="text" class="form-control" placeholder="Votre nom" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" placeholder="Votre email" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Message</label>
                            <textarea class="form-control" rows="5" placeholder="Votre message" required></textarea>
                        </div>

                        <button type="submit" class="btn btn-primary">Envoyer</button>

                    </form>
                </div>

                <!-- Infos contact -->
                <div class="col-md-6">
                    <h4>Nos informations</h4>
                    <p><strong>Email :</strong> contact@exemple.com</p>
                    <p><strong>Téléphone :</strong> +221 77 000 00 00</p>
                    <p><strong>Adresse :</strong> Dakar, Sénégal</p>
                </div>

            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-3">
        <p>© 2026 Mon Portfolio - Tous droits réservés</p>
    </footer>

</body>
</html>
